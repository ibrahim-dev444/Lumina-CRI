# Keeps the hosted demo's free Render server awake, so visitors do not wait a minute for it to start.
# Turn on or off: GitHub > Actions > "Keep demo awake" > ... > Enable / Disable workflow.
# Free while the repository is public. GitHub may run a scheduled job late, so the site can still sleep
# now and then; the website waits and retries on its own when that happens.
name: Keep demo awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the API
        # /api/auth/csrf/ does not touch the database, so Neon can still sleep and save its free hours.
        # A failed ping only warns: it must not email anyone every 10 minutes.
        run: |
          curl -fsS --retry 3 --retry-all-errors --max-time 90 -o /dev/null \
            https://lumina-cri-api.onrender.com/api/auth/csrf/ \
            && echo "Server is awake." \
            || echo "::warning::Server did not answer; it will be pinged again in 10 minutes."
