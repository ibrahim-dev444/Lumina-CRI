# Runs scheduled connector syncs once an hour on the hosted demo: every organization's sources that are set to
# sync every 6, 12 or 24 hours and are due. Lumina only answers if the token matches its SYNC_RUNNER_TOKEN.
# Setup: copy SYNC_RUNNER_TOKEN from Render (Environment) into GitHub > Settings > Secrets and variables >
# Actions > New repository secret, with the same name. Without the secret this job does nothing.
name: Scheduled syncs

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Run due syncs
        env:
          TOKEN: ${{ secrets.SYNC_RUNNER_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then echo "SYNC_RUNNER_TOKEN secret not set; nothing to do."; exit 0; fi
          curl -fsS --retry 3 --retry-all-errors --max-time 300 -X POST \
            -H "X-Sync-Token: $TOKEN" \
            https://lumina-cri-api.onrender.com/api/internal/run-due-syncs/ \
            || echo "::warning::Scheduled sync call failed; it runs again next hour."
