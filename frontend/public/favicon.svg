<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Lumina logo: three records overlap, a white core lights up where they agree. Same drawing as src/components/Loader.tsx (overlap). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6d5cf0"/><stop offset="1" stop-color="#3b2fc9"/></linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0.25"/><stop offset="0.5" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#fff" stop-opacity="0.8"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#bg)"/>
  <rect width="64" height="64" rx="15" fill="url(#shine)"/>
  <g style="mix-blend-mode:screen">
    <circle cx="32" cy="24" r="12" fill="#c4b5fd" fill-opacity="0.8"/>
    <circle cx="24.5" cy="37" r="12" fill="#f9a8d4" fill-opacity="0.75"/>
    <circle cx="39.5" cy="37" r="12" fill="#5eead4" fill-opacity="0.7"/>
  </g>
  <circle cx="32" cy="32.7" r="8" fill="url(#glow)"/>
  <circle cx="32" cy="32.7" r="3.2" fill="#fff"/>
  <rect x="0.5" y="0.5" width="63" height="63" rx="14.5" fill="none" stroke="#fff" stroke-opacity="0.18"/>
</svg>
